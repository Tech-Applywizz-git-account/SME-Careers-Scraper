name: Daily SME scrape

on:
  schedule:
    # 01:30 UTC daily
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run scrape

      - name: Commit updated CSV/JSON
        run: |
          git config user.name "sme-scraper-bot"
          git config user.email "sme-scraper-bot@users.noreply.github.com"
          git add data/jobs.json data/jobs.csv public/data/jobs.json public/data/jobs.csv
          git diff --staged --quiet || git commit -m "chore: daily SME jobs scrape"
          git push
